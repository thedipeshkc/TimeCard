<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TimeCard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>TimeCard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lbox">
    <div class="llogo">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
        <circle cx="19" cy="19" r="17" stroke="#5b8ff9" stroke-width="3"/>
        <path d="M19 10v9l7 5" stroke="#5b8ff9" stroke-width="3" stroke-linecap="round"/>
      </svg>
      TimeCard
    </div>
    <h1 id="lt">Welcome back</h1>
    <p id="ls">Track your hours. Know your pay.</p>
    <div id="lerr" class="lerr hide"></div>
    <div id="lf"></div>
    <button id="lbtn"></button>
    <p id="ltog"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div class="hdr">
    <span class="htitle" id="htitle">Calculator</span>
    <div class="hright">
      <span class="hclock" id="hclock"></span>
      <button class="hbtn" id="btn-exp" title="Export CSV">
        <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v13M7 11l5 5 5-5M4 18h16"/>
        </svg>
      </button>
      <button class="hbtn" id="btn-out" title="Sign out">
        <svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M17 16l4-4-4-4M21 12H9M13 6V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h6a2 2 0 002-2v-1"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="cibar">
    <div class="cil">
      <span class="dot" id="dot"></span>
      <span id="cilbl">Not clocked in</span>
      <span class="ctmr" id="ctmr"></span>
    </div>
    <button class="cibtn" id="btn-ci">Clock In</button>
  </div>

  <div id="pg"></div>

  <nav class="bnav">
    <button class="btab on" data-tab="calculator">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="20" rx="3"/><path d="M8 7h8M8 12h8M8 17h4"/></svg>
      <span>Calc</span>
    </button>
    <button class="btab" data-tab="history">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>History</span>
    </button>
    <button class="btab" data-tab="calendar">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" fill="none" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <span>Calendar</span>
    </button>
    <button class="btab" data-tab="settings">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<div id="toast" style="opacity:0"></div>

<script src="app.js"></script>
</body>
</html>
